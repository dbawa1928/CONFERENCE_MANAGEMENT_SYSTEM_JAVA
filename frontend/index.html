<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConfSync — Smart Conference Management System (PBLJ)</title>
    <meta name="description" content="PBLJ University Java Project - ConfSync Smart Conference Management System">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand" onclick="event.preventDefault(); window.router.navigate('/')">
                <div class="brand-icon">CS</div>
                <span>ConfSync</span>
            </a>

            <nav>
                <ul class="nav-menu">
                    <li><a class="nav-link" onclick="window.router.navigate('/')">Home</a></li>
                    <li><a class="nav-link" onclick="window.router.navigate('/conferences')">Conferences</a></li>
                    <li><a class="nav-link" onclick="window.router.navigate('/about')">About (PBLJ)</a></li>
                    <li><a class="nav-link" onclick="window.router.navigate('/contact')">Contact</a></li>
                </ul>
            </nav>

            <div id="nav-actions" class="nav-actions">
                <!-- Dynamically populated by app.js based on auth state -->
            </div>
        </div>
    </header>

    <!-- Main Dynamic Application Content Container -->
    <main id="app-content">
        <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
            Initializing ConfSync Application...
        </div>
    </main>

    <!-- Universal Modal Container -->
    <div id="modal-container"></div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <!-- System Footer -->
    <footer class="footer">
        <div style="max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <strong>ConfSync — Smart Conference Management System</strong><br>
                <span>Project Based Learning in Java (PBLJ) • University Course Submission</span>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">
                Backend: Java 17/21 • Spring Boot • MySQL 3306 • REST APIs • Hibernate
            </div>
        </div>
    </footer>

    <!-- Application Scripts -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
