# ==============================================================================
# ConfSync - Smart Conference Management System Configuration
# PBLJ University Java Project
# ==============================================================================

spring.application.name=confsync-backend
server.port=8080

# ------------------------------------------------------------------------------
# 🗄️ MySQL Database Configuration (Localhost)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/confsync_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# ☕ Spring Data JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# 📁 Local File Storage (Papers and Certificates)
# ------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=uploads
file.upload-papers-dir=uploads/papers
file.upload-certificates-dir=uploads/certificates

# ------------------------------------------------------------------------------
# 🔐 JWT Security Configuration
# ------------------------------------------------------------------------------
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# ------------------------------------------------------------------------------
# 🌐 CORS Configuration
# ------------------------------------------------------------------------------
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

